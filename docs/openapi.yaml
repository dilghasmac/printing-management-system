openapi: 3.0.3

info:
  title: Printing Management System API
  description: REST API for the Printing Management System
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: API health check

paths:

  /health:
    get:
      tags:
        - Health
      summary: Check API health
      description: Returns the current status of the API.
      operationId: healthCheck

      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  responses:

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    HealthResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: ok

        message:
          type: string
          example: Printing Management System API is running
    
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Something went wrong